---
layout: default
---
<article class="article-shell">
  <header class="article-heading">
    <p class="eyebrow">{{ page.kicker | default: "Portfolio" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
